services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${APP_NAME}
    restart: always
    environment:
      - TZ=${TIMEZONE}
    volumes:
      - .:/var/www/html
    labels:
      - "ofelia.enabled=true"
      - "ofelia.job-exec.sync-jakut.schedule=0 10 */6 * * *"
      - "ofelia.job-exec.sync-jakut.command=sh -c 'php /var/www/html/yii cuaca/sync-jakut >> /var/www/html/runtime/logs/sync-jakut.log 2>&1'"
      - "ofelia.job-exec.sync-jakut.no-overlap=true"
    entrypoint: >
      sh -c " mkdir -p /var/www/html/runtime /var/www/html/web/assets /var/www/html/web/uploads && chown -R www-data:www-data /var/www/html/runtime /var/www/html/web/assets /var/www/html/web/uploads && docker-php-entrypoint php-fpm "
    networks:
      - yii2_network

  # Layanan Database (MySQL)
  db:
    image: mysql:8.4
    container_name: ${DB_CONTAINER_NAME}
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: ${TIMEZONE}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - yii2_network
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u${DB_USER}", "-p${DB_PASSWORD}" ]
      interval: 10s
      timeout: 5s
      retries: 10

  # Layanan Web Server (Nginx)
  nginx:
    image: nginx:alpine
    container_name: ${NGINX_CONTAINER_NAME}
    restart: always
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - yii2_network
  adminer:
    image: adminer:6.0.1
    container_name: ${ADMINER_CONTAINER_NAME}
    restart: always
    ports:
      - "8081:8080" # Akses lewat browser di port 8081
    environment:
      ADMINER_DESIGN: nesta # Tema gelap/modern ala VS Code
    networks:
      - yii2_network

  backup:
    build:
      context: ./docker/backup
      dockerfile: Dockerfile
    container_name: ${BACKUP_CONTAINER_NAME}
    restart: unless-stopped
    environment:
      TZ: ${TIMEZONE}
      MYSQL_HOST: ${DB_HOST}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS}
    volumes:
      - ./runtime/logs:/var/www/html/runtime/logs
      # Source upload Yii2
      - ./web/uploads:/data/uploads:ro
      # Destination backup database
      - ./backup/database:/backup/database
      # Destination backup upload
      - ./backup/uploads:/backup/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - yii2_network
    labels:
      - "ofelia.enabled=true"
      - "ofelia.job-exec.backup-db.schedule=0 0 2 * * *"
      - "ofelia.job-exec.backup-db.command=sh -c '/usr/local/bin/backup-db.sh >> /var/www/html/runtime/logs/backup-db.log 2>&1'"
      - "ofelia.job-exec.backup-db.no-overlap=true"

      - "ofelia.job-exec.backup-upload.schedule=0 30 2 * * *"
      - "ofelia.job-exec.backup-upload.command=sh -c '/usr/local/bin/backup-upload.sh >> /var/www/html/runtime/logs/backup-upload.log 2>&1'"
      - "ofelia.job-exec.backup-upload.no-overlap=true"

  scheduler:
    image: mcuadros/ofelia:0.3
    container_name: ${SCHEDULER_CONTAINER_NAME}
    restart: unless-stopped
    depends_on:
      - app
      - backup
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    environment:
      - TZ=${TIMEZONE}
    command: daemon --docker
    networks:
      - yii2_network

networks:
  yii2_network:
    driver: bridge
volumes:
  db_data:
