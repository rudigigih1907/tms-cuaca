services:
  # Layanan PHP dan Aplikasi
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${APP_NAME}
    environment:
      - DB_HOST=${DB_HOST}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - TZ=Asia/Jakarta
    volumes:
      - .:/app
    depends_on:
      - db

  # Layanan Database (MySQL)
  db:
    image: mysql:8.0
    container_name: ${DB_CONTAINER_NAME}
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

  # Layanan Web Server (Nginx)
  web:
    image: nginx:alpine
    container_name: ${WEB_CONTAINER_NAME}
    ports:
      - "8080:80" # Nginx keeps standard web port
    volumes:
      - .:/app
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: ${PHPMYADMIN_CONTAINER_NAME}
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db

  scheduler:
    image: mcuadros/ofelia:latest
    container_name: ${SCHEDULER_CONTAINER_NAME}
    restart: unless-stopped
    depends_on:
      - app
    # Mengizinkan Ofelia berkomunikasi dengan Docker Socket
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - ./runtime/logs:/etc/ofelia/logs
    environment:
      - TZ=Asia/Jakarta
    command: daemon --docker
    labels:
      # Job 1: Sync BMKG Jakarta Utara 
      ofelia.job-exec.sync_jakut.schedule: "0 10 0 * * *" # otomatis setiap hari jam 00:10
      ofelia.job-exec.sync_jakut.container: ${APP_NAME}
      ofelia.job-exec.sync_jakut.command: "php yii cuaca/sync-jakut"
      # (Opsional) Kirim log output jika terjadi error
      ofelia.job-exec.sync_jakut.no-overlap: "true"
      ofelia.job-exec.sync_jakut.save-folder: "/etc/ofelia/logs"
volumes:
  db_data:
